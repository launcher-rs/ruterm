# 持续集成：push / PR / 手动触发，只做格式与静态检查。
#
# 编译、冒烟与打包交给 release.yml（tag 或手动触发），普通推送不必等全量构建。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交会取消进行中的旧跑，省 runner 时长。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # clippy 要完整编译一遍，系统依赖与构建一致；Linux 故意钉 22.04（glibc 基线只升不降）。
      - name: 安装系统依赖（Linux）
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libasound2-dev libudev-dev

      - name: 格式检查（cargo fmt --check）
        shell: bash
        run: cargo fmt --check

      - name: 静态检查（cargo clippy -- -D warnings）
        shell: bash
        run: cargo clippy -- -D warnings