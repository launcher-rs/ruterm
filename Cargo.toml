[package]
name = "rulink"
version = "0.1.0"
edition = "2024"
description = "面向开发者的开源远程连接工具（SSH 客户端），基于 rgpui + rgpui-term 外接 IO 后端"

[dependencies]
rgpui = { version = "1.6.0", features = ["tokio"] }
rgpui-platform = "1.6.0"
rgpui-term = "1.6.0"
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "net", "io-util", "time"] }
bytes = "1"
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turso = { version = "0.7.2", default-features = false }
toasty = { version = "0.11", default-features = false, features = ["turso"] }
toasty-driver-turso = "0.11"
argon2 = "0.5"
keyring = "4.2.0"
getrandom = "0.4.3"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
sha2 = "0.11"
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
# 提取 shell 可执行文件的系统图标：Win32 取 HICON，png 编成 rgpui 能直接吃的字节。
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
png = "0.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
