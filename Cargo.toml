[package]
name = "ruterm"
version = "0.1.0"
edition = "2024"
description = "面向开发者的开源远程连接工具（SSH 客户端），基于 rgpui + rgpui-term 外接 IO 后端"

[dependencies]
rgpui = { version = "1.6.0", features = ["tokio"] }
rgpui-platform = "1.6.0"
rgpui-term = "1.6.0"
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0.1"
zmodem2 = "0.7.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "net", "io-util", "time", "fs"] }
bytes = "1"
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turso = { version = "0.7.2", default-features = false }
toasty = { version = "0.11", default-features = false, features = ["turso"] }
toasty-driver-turso = "0.11"
argon2 = "0.5"
keyring = "4.2.0"
getrandom = "0.4.3"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
sha2 = "0.11"
base64 = "0.23"
# VNC 认证（RFB 的 VNC Authentication 是 DES-ECB 挑战应答，安全性由协议决定）。
des = "0.9"
# 远程桌面帧：把 VNC 的 BGRA 快照包成 rgpui `RenderImage` 的帧（与 rgpui 同版本）。
image = { version = "0.25.10", default-features = false }

[target.'cfg(windows)'.dependencies]
# 提取 shell 可执行文件的系统图标：Win32 取 HICON，png 编成 rgpui 能直接吃的字节。
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
png = "0.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"



# release 优化
# 日常发版用 thin LTO（构建快）；打安装包用下面的 size 档（体积最小）。
[profile.release]
# 最高优化等级，图片编解码与标注烧录受益明显。
opt-level = 3
# 跨 crate 内联 + 死代码消除，增量代价可接受（rgpui 体积指南 §2.1）。
lto = "thin"
# 单代码生成单元，配合 lto 进一步内联，牺牲并行编译速度换运行速度。
codegen-units = 1
# 剥离符号表，减小发布包体积。
strip = true

# size 档：只用于打安装包（构建慢，体积最小）。
[profile.size]
inherits = "release"
# 体积优先。
opt-level = "z"
# fat LTO：比 thin 更彻底的跨 crate 内联与死代码消除。
lto = true
codegen-units = 1
strip = true
