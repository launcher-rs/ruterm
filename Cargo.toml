[package]
name = "ruterm"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/launcher-rs/ruterm"
readme = "README.md"
description = "Rust 远程连接工具，集成 SSH、本地终端、SFTP 与远程桌面"

[dependencies]
rgpui = { version = "1.8.3", features = ["tokio"] }
rgpui-platform = "1.8.3"
rgpui-term = "1.8.3"
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0.1"
zmodem2 = "0.7.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "net", "io-util", "time", "fs"] }
bytes = "1"
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turso = { version = "0.7.2", default-features = false }
toasty = { version = "0.11", default-features = false, features = ["turso"] }
toasty-driver-turso = "0.11"
argon2 = "0.5"
keyring = "4.2.0"
getrandom = "0.4.3"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
sha2 = "0.11"
base64 = "0.23"
# VNC 认证（RFB 的 VNC Authentication 是 DES-ECB 挑战应答，安全性由协议决定）。
des = "0.9"
# 远程桌面帧：把 VNC 的 BGRA 快照包成 rgpui `RenderImage` 的帧（与 rgpui 同版本）。
image = { version = "0.25.10", default-features = false }
# RDP 客户端（IronRDP）。客户端 + 输入 + 协议层 + 剪贴板重定向；服务端 / 音频不拉进来。
# 剪贴板在 Windows 上由 ironrdp-cliprdr-native 直接挂系统剪贴板，文本双向自动同步。
# 本机副本还提供拖放上传的进度登记（写剪贴板前登记，剪贴板线程回报已发送字节）。
ironrdp-cliprdr-native = { path = "vendor/cliprdr-native" }
ironrdp = { version = "0.17", default-features = false, features = [
    "client",
    "client-clipboard",
    "input",
    "core",
    "pdu",
    "native-tls",
] }
# 间接依赖，只为钉版本：ironrdp-connector 要 `sspi ^0.21`，0.21.0 钉了
# curve25519-dalek 的预发布版（与 russh 已解析的 5.0.0 冲突）；0.21.3 没有这个问题。
sspi = "=0.21.3"

[patch.crates-io]
# Require system CA + hostname validation in both TLS backends.
ironrdp-tls = { path = "vendor/ironrdp-tls" }
# ironrdp-connector 的 CredSSP 唯一用到的是 `picky::key::PrivateKey`。上游
# 7.0.0-rc.25 把 curve25519-dalek 等钉在预发布版，与 russh 已解析的 5.0.0 /
# 3.0.0 落在同一兼容区间而无法共存；本地副本只把几个 RustCrypto 依赖跟到
# 已发布版本，并裁掉不需要的 jose / pkcs12 默认特性，其余代码原样。
picky = { path = "vendor/picky" }
# 同理：sspi 的 macOS / iOS 目标依赖钉了 curve25519-dalek / ed25519-dalek 的
# 预发布版（Windows 构建根本不编译那段），本地副本只把这行跟到已发布版本。
sspi = { path = "vendor/sspi" }
# IronRDP 0.17 的剪贴板后端钉在 cliprdr 0.7，而上游原生后端 0.7 只有文本；
# 本地副本移植上游 0.9 的 Windows 文件剪贴板实现（CF_HDROP / 文件流），
# 只保留 Windows 后端，Linux 继续走 stub。
ironrdp-cliprdr-native = { path = "vendor/cliprdr-native" }
# 临时：rgpui 的预设阴影（shadow_md/lg 等）在终端 canvas 的浮层上会被
# 合成为斜纹/三角形灰块，命令补全面板和右键菜单都中招。本地宏副本把预设
# 阴影统一置空，显式 shadow(vec![...]) 仍可用；上游修好后删掉这段即可。
rgpui-macros = { path = "vendor/rgpui-macros" }

[target.'cfg(windows)'.dependencies]
# 提取 shell 可执行文件的系统图标：Win32 取 HICON，png 编成 rgpui 能直接吃的字节。
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
png = "0.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"



# 日常 `cargo run` 也把依赖按优化编译：RDP 每个更新包都要整帧搬像素，
# ironrdp / image / rgpui 这些库在 opt-level 0 下一包要 20+ms，首屏会从上往下
# 慢慢刷出来、拖动时也卡。
[profile.dev.package."*"]
opt-level = 2

# 本 crate 也开一档优化：帧转换、元素树构造这些热路径在 opt-level 0 下慢一个
# 数量级（实测 1080p 整帧补 alpha 从 20ms 降到 0.4ms），连上 RDP 后每帧都要跑，
# 不优化就是持续掉帧。opt-level 1 相比 2 的运行时差别很小，但增量编译快得多。
[profile.dev]
opt-level = 1

# release 优化
# 日常发版用 thin LTO（构建快）；打安装包用下面的 size 档（体积最小）。
[profile.release]
# 最高优化等级，热路径都在 CPU 侧：终端逐帧解析与重绘、russh 加解密、SFTP / ZMODEM 分块搬运。
opt-level = 3
# 跨 crate 内联 + 死代码消除，增量代价可接受（rgpui 体积指南 §2.1）。
lto = "thin"
# 单代码生成单元，配合 lto 进一步内联，牺牲并行编译速度换运行速度。
codegen-units = 1
# 剥离符号表，减小发布包体积。
strip = true

# size 档：只用于打安装包（构建慢，体积最小）。
[profile.size]
inherits = "release"
# 体积优先。
opt-level = "z"
# fat LTO：比 thin 更彻底的跨 crate 内联与死代码消除。
lto = true
codegen-units = 1
strip = true
