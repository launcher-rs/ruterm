<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 176" role="img" aria-labelledby="title desc">
  <title id="title">RuTerm</title>
  <desc id="desc">A terminal prompt and cursor inside a connected window, followed by the RuTerm wordmark.</desc>
