    <rect x="27" y="35" width="106" height="90" rx="16" fill="none" stroke="url(#brand)" stroke-width="7"/>
    <path d="m48 66 20 15-20 15" fill="none" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="78" y="92" width="31" height="8" rx="4" fill="#22D3EE"/>
