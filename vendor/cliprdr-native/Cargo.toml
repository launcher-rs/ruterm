[package]
name = "ironrdp-cliprdr-native"
version = "0.7.0"
edition = "2024"
description = "Native CLIPRDR static channel backend implementations for IronRDP (vendored with Windows file transfer)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Devolutions/IronRDP"

# 本机副本：IronRDP 0.17 的工具链钉在 cliprdr 0.7 / core 0.2，而上游
# ironrdp-cliprdr-native 0.9 的 Windows 后端才实现文件剪贴板；这里把 0.9 的
# Windows 实现原样移植到 0.7 的协议层，其余（文本剪贴板）行为保持不变。

[lib]
name = "ironrdp_cliprdr_native"
path = "src/lib.rs"

[dependencies]
ironrdp-cliprdr = "0.7"
ironrdp-core = "0.2"
tracing = { version = "0.1", features = ["log"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_Marshal",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
